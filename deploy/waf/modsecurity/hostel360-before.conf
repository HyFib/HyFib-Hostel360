# Server-to-server endpoints whose request bodies are authenticated by an HMAC signature
# over the raw body (Razorpay webhooks, the host agent, OCI Monitoring notifications). The
# payloads carry free text and alarm queries; protocol rules still apply.
SecRule REQUEST_FILENAME "@rx ^/api/(?:v[12]/)?method/hostel360\.api\.(?:payments\.razorpay_webhook|ops\.(?:ingest|oci_notification))$" \
	"id:10110,\
	phase:1,\
	pass,\
	t:none,\
	nolog,\
	ver:'hostel360/1.0',\
	ctl:ruleRemoveByTag=attack-xss,\
	ctl:ruleRemoveByTag=attack-sqli,\
	ctl:ruleRemoveByTag=attack-rce,\
	ctl:ruleRemoveByTag=attack-injection-php,\
	ctl:ruleRemoveByTag=attack-injection-generic,\
	ctl:ruleRemoveByTag=attack-generic,\
	ctl:ruleRemoveByTag=attack-lfi,\
	ctl:ruleRemoveByTag=attack-rfi,\
	ctl:ruleRemoveByTag=attack-ssti,\
	ctl:ruleRemoveByTag=attack-ssrf"

# Load balancer health checks address the backend by IP and send no browser headers.
SecRule REQUEST_FILENAME "@streq /api/method/hostel360.api.health.liveness" \
	"id:10120,\
	phase:1,\
	pass,\
	t:none,\
	nolog,\
	ver:'hostel360/1.0',\
	ctl:ruleRemoveById=920280,\
	ctl:ruleRemoveById=920350"
