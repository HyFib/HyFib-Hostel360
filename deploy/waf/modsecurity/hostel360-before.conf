# HyFib Hostel360: CRS rule exclusions for Frappe Framework v16 (loaded before the CRS rules).
#
# Paranoia level 1 with an inbound anomaly threshold of 5 blocks attacks with very few false
# positives on ordinary forms, but Frappe Desk legitimately sends HTML, Jinja, code and
# SQL-like filter expressions in a handful of arguments. Each exclusion below is scoped to the
# request path AND the named arguments; every other argument of those requests, and every
# other request, still gets the full rule set. All of these endpoints require a logged-in
# desk user (two-factor authentication is mandatory for desk roles).
#
# Rule ids 10100-10199 are in the local-use range.

# Desk document save, submit and cancel: "doc" carries the whole document as JSON,
# including rich text, HTML print formats and Jinja message templates.
SecRule REQUEST_FILENAME "@rx ^/api/(?:v[12]/)?method/(?:frappe\.desk\.form\.save\.(?:savedocs|cancel)|frappe\.client\.(?:save|insert|insert_many|submit|bulk_update))$" \
	"id:10101,\
	phase:1,\
	pass,\
	t:none,\
	nolog,\
	ver:'hostel360/1.0',\
	ctl:ruleRemoveTargetByTag=attack-xss;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-generic;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-ssti;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:doc,\
	ctl:ruleRemoveTargetByTag=attack-xss;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-generic;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-ssti;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:docs,\
	ctl:ruleRemoveTargetByTag=attack-xss;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-rce;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-generic;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-ssti;ARGS:doclist,\
	ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:doclist"

