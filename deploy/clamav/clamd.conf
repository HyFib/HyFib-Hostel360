# HyFib Hostel360: clamd configuration (mounted read-only into the clamav container).
#
# clamd serves two clients:
#   - the application, over TCP 3310 on the container network (scan-on-upload, INSTREAM)
#   - Linux Malware Detect on the host, over the unix socket that is bind-mounted to
#     /run/hostel360/clamav; maldet passes open file descriptors (clamdscan --fdpass), so
#     clamd never needs to see host paths.
# One clamd for both keeps a single copy of the signature database in memory.

# clamd refuses to log through the /dev/stdout symlink; the log file is on the block
# volume (logs/clamav) and rotated by logrotate on the host with the other security logs.
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 0
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo yes

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User clamav

LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0

MaxConnectionQueueLength 64
MaxThreads 8
MaxQueue 100
ReadTimeout 60
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 30
SelfCheck 3600

# Reload new signatures in place instead of loading a second copy alongside the first;
# scans pause for well under a minute during a reload, but memory stays bounded.
ConcurrentDatabaseReload no

Bytecode yes
BytecodeSecurity TrustSigned
DetectPUA no
HeuristicAlerts yes
HeuristicScanPrecedence no
AlertOLE2Macros yes
PhishingSignatures yes
PhishingScanURLs yes

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanHTML yes
ScanMail yes
ScanArchive yes

# Uploads are limited to 10 MB by the application; streams and nested content get headroom.
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxScanTime 120000
MaxRecursion 16
MaxFiles 10000

ExcludePath ^/proc/
ExcludePath ^/sys/
