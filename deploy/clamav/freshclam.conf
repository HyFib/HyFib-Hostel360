# HyFib Hostel360: freshclam configuration (mounted read-only into the clamav container).
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
# The container also prints update progress to its standard output (docker logs).
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 0
LogTime yes
LogVerbose no

DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Twelve checks a day (every two hours), the rate the ClamAV mirrors ask for.
Checks 12
ConnectTimeout 30
ReceiveTimeout 120

NotifyClamd /etc/clamav/clamd.conf
# Testing a download loads a second full copy of the signatures; with the memory budget
# of this host that is not affordable. clamd validates the database when it reloads.
TestDatabases no
