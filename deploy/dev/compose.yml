# Local development environment for HyFib Hostel360.
# Usage: see docs/DEVELOPMENT.md
name: h360-dev

services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:-devroot}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine

  redis-queue:
    image: redis:8.6-alpine
    volumes:
      - redis-queue-data:/data

  bench:
    image: frappe/build:v16
    entrypoint: ["sleep", "infinity"]
    working_dir: /home/frappe/frappe-bench
    environment:
      SHELL: /bin/bash
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:5173:5173"
    volumes:
      - bench:/home/frappe/frappe-bench
      - ../..:/workspace/hostel360
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  mariadb-data:
  redis-queue-data:
  bench:
