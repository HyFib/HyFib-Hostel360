; HyFib Hostel360: PHP-FPM pool for the hostel website integration pages.
;
; Tender clause 6.5 asks for 300 PHP workers. pm = ondemand provides them without holding
; memory while idle: workers are started as requests arrive, up to pm.max_children, and each
; exits after pm.process_idle_timeout without work. The pages are small and finish in a few
; milliseconds, so even a burst of traffic needs only a handful of live workers.
;
; Mounted at /usr/local/etc/php-fpm.d/www.conf; it is read after the image's docker.conf, so
; the values here win. The container runs the master as www-data (no root, no capabilities),
; which is why no user/group directives are set.

[www]
listen = 9000
listen.backlog = 511

pm = ondemand
pm.max_children = 300
pm.process_idle_timeout = 10s
pm.max_requests = 1000

; Liveness and pool status. The WAF exposes them only to requests from inside its own
; container (the host agent runs them through docker exec).
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

request_terminate_timeout = 30s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
rlimit_files = 4096

; Every request is already in the WAF access log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

; Only the variables the pages need reach the workers.
clear_env = yes
env[H360_PORTAL_URL] = $H360_PORTAL_URL
env[H360_INSTITUTION_NAME] = $H360_INSTITUTION_NAME
env[H360_INSTITUTION_SHORT_NAME] = $H360_INSTITUTION_SHORT_NAME
env[H360_SUPPORT_PHONE] = $H360_SUPPORT_PHONE
env[H360_SUPPORT_EMAIL] = $H360_SUPPORT_EMAIL
env[H360_WEBSITE_ORIGINS] = $H360_WEBSITE_ORIGINS

security.limit_extensions = .php

php_admin_value[memory_limit] = 32M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[open_basedir] = /var/www/hostel360:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,show_source,highlight_file,phpinfo,putenv,symlink,link,mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,stream_socket_server
