; HyFib Hostel360: PHP runtime hardening for the integration pages.
; Mounted at /usr/local/etc/php/conf.d/zz-hostel360.ini (loaded last).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
zend.exception_ignore_args = On
html_errors = Off

date.timezone = Asia/Kolkata
default_charset = "UTF-8"

memory_limit = 32M
max_execution_time = 15
max_input_time = 15
max_input_vars = 200
post_max_size = 64K
file_uploads = Off
upload_max_filesize = 0

allow_url_fopen = Off
allow_url_include = Off
cgi.fix_pathinfo = 0
enable_dl = Off
; disable_functions is set on the FPM pool (pool.d/www.conf) so the container health
; check, which runs on the CLI, can still open its FastCGI socket.

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 1000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
