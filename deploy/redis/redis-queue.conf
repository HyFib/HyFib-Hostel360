# HyFib Hostel360: Redis queue (Frappe redis_queue: background jobs, realtime pub/sub,
# scheduler locks). Jobs must never be dropped, so memory is never evicted and the
# append-only file survives restarts. Reachable only on the internal container network.
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60
timeout 0
databases 16

maxmemory 512mb
maxmemory-policy noeviction

dir /data
save ""
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
no-appendfsync-on-rewrite no

loglevel notice
logfile ""
