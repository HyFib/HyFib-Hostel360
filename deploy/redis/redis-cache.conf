# HyFib Hostel360: Redis cache (Frappe redis_cache).
# Pure cache: no persistence, least-recently-used eviction when full. Reachable only on the
# internal container network, which has no route outside the host.
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60
timeout 0
databases 16

maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

save ""
appendonly no

loglevel notice
logfile ""
