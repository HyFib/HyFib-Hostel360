h360_timezone: Asia/Kolkata
# CERT-In directions (28 April 2022): synchronise to NIC and NPL time servers
h360_ntp_servers:
  - samay1.nic.in
  - samay2.nic.in
  - time.nplindia.org
h360_log_retention_days: 180
h360_journal_max_use: 4G
h360_swap_size_mb: 4096
h360_admin_group: hostel360-admins
h360_admin_users: []
h360_base_packages:
  - acl
  - apt-listchanges
  - bzip2
  - ca-certificates
  - chrony
  - curl
  - git
  - gnupg
  - htop
  - iotop
  - jq
  - logrotate
  - ncdu
  - needrestart
  - python3
  - python3-debian
  - python3-venv
  # QR codes on the terminal for h360-2fa-enrol (authenticator app enrolment)
  - qrencode
  - rsync
  - sysstat
  - unattended-upgrades
  - unzip
  - util-linux
