- name: Host agent settings
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ h360_config_dir }}/agent.env"
    owner: root
    group: root
    mode: "0600"

- name: Host agent and uptime probe timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ h360_monitoring_timers }}"
