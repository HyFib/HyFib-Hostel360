# Hostel360: ban client addresses at the WAF.
#
# Clients arrive through the OCI load balancer, so a host firewall ban would only ever hit
# the load balancer. h360-waf-ban adds the client address to the WAF's deny list (nginx geo
# map) and reloads nginx; banned clients get 403 until fail2ban unbans them.
[Definition]
actionstart =
actionstop = /usr/local/sbin/h360-waf-ban flush
actioncheck =
actionban = /usr/local/sbin/h360-waf-ban ban <ip>
actionunban = /usr/local/sbin/h360-waf-ban unban <ip>
