# Hostel360: failed sign-ins in the WAF access log (format "h360").
# Desk login (/api/method/login) answers 401 on a wrong password, OTP verification 401 on a
# wrong code, and 403 when an account is refused.
#
# Only those count. A 429 means the request was already refused by a rate limit (the
# application's per-number and per-address OTP limits, or the WAF's limit_req, whose own log
# lines feed the h360-ratelimit jail), and a 417 is a mistyped number or code. Counting them
# turned ordinary throttling into a ban of the whole site for every client behind the same
# address, such as the campus Wi-Fi gateway.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "POST /api/(?:v[12]/)?method/(?:login|hostel360\.api\.auth\.(?:verify_otp|send_otp)) HTTP/[0-9.]+" (?:401|403)\s
ignoreregex =
