# Hostel360: failed or throttled sign-ins in the WAF access log (format "h360").
# Desk login (/api/method/login) answers 401 on a wrong password; OTP verification and
# throttled requests answer 401/403/417/429.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "POST /api/(?:v[12]/)?method/(?:login|hostel360\.api\.auth\.(?:verify_otp|send_otp)) HTTP/[0-9.]+" (?:401|403|417|429)\s
ignoreregex =
