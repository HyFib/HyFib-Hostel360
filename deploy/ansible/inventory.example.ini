# Copy to inventory.ini. The server has no public address: Ansible connects through an
# OCI Bastion port-forwarding session to the server's private IP.
#
# 1. Create a session (valid up to 3 hours) and note its id:
#      oci bastion session create-port-forwarding \
#        --bastion-id <terraform output bastion_id> \
#        --target-private-ip <terraform output instance_private_ip> --target-port 22 \
#        --ssh-public-key-file ~/.ssh/id_ed25519.pub --session-ttl 10800
# 2. Put the session id below (ansible_ssh_common_args) and run the playbook.

[hostel360]
hostel360-prod-hyd ansible_host=10.20.2.10

[hostel360:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args='-o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -W %h:%p -p 22 ocid1.bastionsession.oc1.ap-hyderabad-1.EXAMPLE@host.bastion.ap-hyderabad-1.oci.oraclecloud.com"'
