# Stand-in for the frontend nginx and PHP-FPM behind the WAF under test. It answers like the
# real application does for the paths the checks use, so a 403 can only come from the WAF.
pid /tmp/stub.pid;
error_log /dev/stderr warn;

events {
	worker_connections 64;
}

http {
	access_log off;
	client_body_temp_path /tmp/stub-body;
	proxy_temp_path /tmp/stub-proxy;
	fastcgi_temp_path /tmp/stub-fastcgi;
	uwsgi_temp_path /tmp/stub-uwsgi;
	scgi_temp_path /tmp/stub-scgi;
	default_type text/plain;

	server {
		listen 8080 default_server;

		# hostel360.api.payments.payu_return answers with a 303 to the portal's fees page
		location = /api/method/hostel360.api.payments.payu_return {
			return 303 /hostel/fees?payment=HPT-TEST&status=success;
		}

		location / {
			return 200 "stub upstream\n";
		}
	}

	# PHP-FPM's address only has to resolve and accept connections when nginx starts.
	server {
		listen 9000;
		return 200 "stub php\n";
	}
}
