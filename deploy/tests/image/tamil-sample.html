<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<title>Tamil print check</title>
<style>
	body { font-size: 12pt; }
	/* the font stacks the mess bill and the bonafide certificate use */
	.sans { font-family: "InterVariable", "Inter", "Helvetica Neue", Arial, "Noto Sans Tamil", "Noto Sans Tamil UI", "Lohit Tamil", sans-serif; }
	.serif { font-family: "Times New Roman", Times, "Liberation Serif", "DejaVu Serif", Georgia, "Noto Serif Tamil", "Noto Sans Tamil", "Lohit Tamil", serif; }
</style>
</head>
<body>
	<!-- no font-family: the engine default, as on the fee receipt and invoice -->
	<p id="default">ரசீது Receipt / விடுதி கட்டணம் ₹1,500 / கொடுப்பனவு பொங்கல் கௌரவம்</p>
	<p id="sans" class="sans">மாணவர் Student / மெஸ் கட்டணம் / அறை எண் 12</p>
	<p id="serif" class="serif">சான்றிதழ் Certificate / ஸ்ரீ க்ஷேமம் / விடுதிக் காப்பாளர்</p>

</html>
