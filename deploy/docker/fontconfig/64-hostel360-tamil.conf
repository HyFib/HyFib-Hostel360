<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
	Tamil text in print PDFs (wkhtmltopdf and Chromium) is drawn with Noto Sans Tamil, or
	Noto Serif Tamil inside serif text, so it matches the Noto Sans and Noto Serif Latin faces
	next to it.

	A print format rarely names a Tamil font; the engines then take the first font fontconfig
	lists for the generic family that has the glyph. Stock fontconfig lists Lohit Tamil there
	(65-nonlatin.conf), which is lighter and smaller than the Latin text around it. These rules
	run before 65-nonlatin.conf and only add the Noto Tamil faces in front of that list: Latin
	faces keep their place ahead of them, so English text is unaffected, and Lohit Tamil stays
	installed as the last resort.
-->
<fontconfig>
	<description>Hostel360: Noto Tamil faces for Tamil text</description>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Noto Sans Tamil</family>
		</prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer>
			<family>Noto Serif Tamil</family>
			<family>Noto Sans Tamil</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Noto Sans Tamil</family>
		</prefer>
	</alias>
	<alias>
		<family>system-ui</family>
		<prefer>
			<family>Noto Sans Tamil</family>
		</prefer>
	</alias>
</fontconfig>
