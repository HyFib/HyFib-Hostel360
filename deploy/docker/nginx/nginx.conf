# Main nginx configuration for the Hostel360 frontend role.
#
# nginx runs as the unprivileged frappe user, so every path it writes (pid, temp files,
# rendered vhost) is under /tmp/nginx, which is a tmpfs in the compose stack.

worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 2048;
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 4096;
	server_names_hash_bucket_size 128;

	client_body_temp_path /tmp/nginx/client_body;
	proxy_temp_path /tmp/nginx/proxy;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	# Every request is already logged by the WAF with the client address and timings;
	# logging it a second time here would only double the disk writes.
	access_log off;

	include /tmp/nginx/conf.d/*.conf;
}
