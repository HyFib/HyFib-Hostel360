[project]
name = "hostel360"
authors = [
    { name = "HyFib Solutions Private Limited", email = "support@hyfib.com" }
]
description = "HyFib Hostel360 - cloud-based hostel management software"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
coverage = "~=7.6"

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["frontend", "deploy", "node_modules"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "S",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
    "UP037",
    "UP040",
    "RUF012",
    "S101",
    "S311",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
